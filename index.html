<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON BREAKER</title>
  <style>
    :root { --page:#080718; --surface:#161132e8; --ink:#f9f7ff; --muted:#aaa5ce; --line:#9d81ff8a; --canvas:#09081e; --top:#302367; color-scheme:dark; }
    body.light { --page:#e7edff; --surface:#fffffff0; --ink:#201a3d; --muted:#665e82; --line:#8e70e9a0; --canvas:#f5f2ff; --top:#e1d7ff; color-scheme:light; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; overflow:auto; font-family:system-ui,sans-serif; color:var(--ink); background:radial-gradient(circle at 50% 0%,var(--top),var(--page) 60%); transition:.25s; }
    .game-shell { width:min(95vw,760px); padding:20px; border:1px solid var(--line); border-radius:24px; background:var(--surface); box-shadow:0 20px 70px #0004; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:15px; } h1 { margin:0; font-size:clamp(1.55rem,5vw,2.3rem); letter-spacing:-1px; } h1 span { color:#ec5bb6; }
    .top-right { display:flex; align-items:center; gap:14px; }.stats { display:flex; gap:14px; text-align:right; font-size:.72rem; color:var(--muted); font-weight:700; }.stats b { display:block; font-size:1.05rem; color:var(--ink); }
    button { border:0; border-radius:999px; padding:10px 20px; cursor:pointer; color:#190e35; background:linear-gradient(105deg,#6df3ff,#d58aff 55%,#ff70bd); box-shadow:0 4px 15px #a968ae55; font-weight:800; } button:hover { filter:brightness(1.07); transform:translateY(-1px); }
    #theme { padding:8px 12px; font-size:.82rem; white-space:nowrap; }.canvas-wrap { position:relative; overflow:hidden; aspect-ratio:16/10; border-radius:14px; border:1px solid var(--line); background:var(--canvas); } canvas { display:block; width:100%; height:100%; }
    .overlay { position:absolute; inset:0; z-index:2; display:grid; place-content:center; gap:14px; padding:25px; text-align:center; background:#100923a9; color:#fff; backdrop-filter:blur(3px); }.overlay.hidden{opacity:0;pointer-events:none}.overlay h2{margin:0;font-size:clamp(2rem,7vw,3.2rem)}.overlay p{margin:0;color:#eee9ff}.name-row,.mode-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.name-row input{width:150px;border:1px solid #cbb7ff;border-radius:99px;padding:10px 14px;font:inherit}.name-row[hidden],.mode-row[hidden]{display:none}.mode-row button{min-width:126px}.mode-row small{display:block;font-weight:500;opacity:.8;margin-top:2px}
    .bottom { display:grid; grid-template-columns:1fr 210px; gap:18px; margin-top:15px; }.guide { align-self:center; margin:0; color:var(--muted); text-align:center; font-size:.86rem; } kbd { padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--ink); }
    .ranking { border:1px solid var(--line); border-radius:12px; padding:10px 13px; }.ranking h2{font-size:.86rem;margin:0 0 7px}.ranking ol{margin:0;padding-left:25px;font-size:.84rem;line-height:1.65}.ranking li{padding-left:5px}.ranking span{float:right;font-weight:800}.empty{color:var(--muted);list-style:none;margin-left:-25px}
    @media(max-width:570px){.game-shell{padding:13px}.stats{gap:8px}.bottom{grid-template-columns:1fr}.ranking{max-width:300px;justify-self:center;width:100%}.top-right{gap:6px}}
  </style>
</head>
<body>
  <main class="game-shell">
    <header><h1>벽돌 <span>깨기</span></h1><div class="top-right"><div class="stats"><div>SCORE<b id="score">0000</b></div><div>LIVES<b id="lives">♥ ♥ ♥</b></div><div>LEVEL<b id="level">1</b></div></div><button id="theme" aria-label="테마 전환">☀️ 라이트 테마</button></div></header>
    <div class="canvas-wrap"><canvas id="game" width="960" height="600" aria-label="벽돌 깨기 게임"></canvas><div class="overlay" id="overlay"><h2 id="message">NEON BREAKER</h2><p id="submessage">난이도를 선택하고 모든 벽돌을 부숴보세요!</p><div class="mode-row" id="mode-row"><button data-mode="easy">이지 모드<small>일정한 공 속도</small></button><button data-mode="hard">하드 모드<small>받을수록 공 가속</small></button></div><div class="name-row" id="name-row" hidden><input id="player-name" maxlength="10" placeholder="이름 (최대 10자)"><button id="save-score">기록 저장</button></div><button id="start" hidden>게임 시작</button></div></div>
    <section class="bottom"><p class="guide"><kbd>←</kbd> <kbd>→</kbd> 또는 마우스/터치로 패들을 조작하세요 · <kbd>Space</kbd> 공 발사</p><aside class="ranking"><h2>🏆 TOP 5 RANKING</h2><ol id="ranking-list"></ol></aside></section>
  </main>
  <script>
    const $=s=>document.querySelector(s), canvas=$('#game'),ctx=canvas.getContext('2d'), W=960,H=600;
    const paddle={w:150,h:17,x:405,y:550,speed:16,move:0}; let ball,bricks,score,lives,level,running,launched,frame,scoreSaved=false,mode='easy',particles=[];
    const colors=['#ff5dbe','#b16cff','#6d9cff','#64e7ff','#70f6c1','#edff75'];
    function updateStats(){$('#score').textContent=String(score).padStart(4,'0');$('#lives').textContent='♥ '.repeat(lives).trim()||'—';$('#level').textContent=level;}
    function renderRanking(){const list=$('#ranking-list'),data=JSON.parse(localStorage.getItem('neon-breaker-ranking')||'[]');list.innerHTML=data.length?data.map(x=>`<li>${escapeHtml(x.name)} <span>${x.score}</span></li>`).join(''):'<li class="empty">아직 기록이 없어요</li>';}
    function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
    function saveScore(){if(scoreSaved)return;const name=$('#player-name').value.trim()||'PLAYER';const data=JSON.parse(localStorage.getItem('neon-breaker-ranking')||'[]');data.push({name,score});data.sort((a,b)=>b.score-a.score);localStorage.setItem('neon-breaker-ranking',JSON.stringify(data.slice(0,5)));scoreSaved=true;renderRanking();$('#name-row').hidden=true;$('#submessage').textContent='랭킹에 기록되었습니다!';}
    function newBall(){ball={x:paddle.x+paddle.w/2,y:paddle.y-14,r:9,vx:5.2*(Math.random()>.5?1:-1),vy:-5.2};launched=false;}
    function createBricks(){const rows=5+Math.min(level-1,2),cols=10,bw=79,bh=27,gap=9,left=(W-(cols*bw+(cols-1)*gap))/2;bricks=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;bricks.push({x:left+c*(bw+gap),y:70+r*(bh+gap),w:bw,h:bh,hp:r>3&&level>1?2:1,color:colors[r%6]}),c++);}
    function resetGame(){score=0;lives=3;level=1;particles=[];paddle.x=(W-paddle.w)/2;createBricks();newBall();updateStats();}
    function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
    function burst(x,y,color){for(let i=0;i<16;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,size:3+Math.random()*5,color,life:1});}}
    function draw(){ctx.clearRect(0,0,W,H);const light=document.body.classList.contains('light'),bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,light?'#e8e2ff':'#15113e');bg.addColorStop(1,light?'#f8f6ff':'#070716');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);bricks.forEach(b=>{ctx.shadowBlur=15;ctx.shadowColor=b.color;rounded(b.x,b.y,b.w,b.h,6);ctx.fillStyle=b.color;ctx.fill();ctx.shadowBlur=0;if(b.hp===2){ctx.fillStyle='#fff8';rounded(b.x+5,b.y+5,b.w-10,4,2);ctx.fill();}});particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);});ctx.globalAlpha=1;ctx.shadowBlur=18;ctx.shadowColor='#70f6ff';rounded(paddle.x,paddle.y,paddle.w,paddle.h,9);ctx.fillStyle='#b9f9ff';ctx.fill();ctx.shadowBlur=0;const g=ctx.createRadialGradient(ball.x-3,ball.y-3,1,ball.x,ball.y,ball.r+4);if(light){g.addColorStop(0,'#4b286f');g.addColorStop(.55,'#673b91');g.addColorStop(1,'#2b164b');ctx.shadowColor='#6e4a9a';}else{g.addColorStop(0,'#fff');g.addColorStop(.45,'#fff8b8');g.addColorStop(1,'#ff70c9');ctx.shadowColor='#ff76db';}ctx.shadowBlur=light?10:24;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.shadowBlur=0;}
    function end(win){running=false;cancelAnimationFrame(frame);$('#overlay').classList.remove('hidden');$('#message').textContent=win?'LEVEL CLEAR!':'GAME OVER';$('#submessage').textContent=win?'다음 레벨에 도전해보세요!':'목숨을 모두 잃었습니다 · 최종 점수: '+score;$('#name-row').hidden=win||lives>0||scoreSaved;$('#start').textContent=win?'다음 레벨':'다시 시작';$('#start').onclick=()=>{if(win){level++;createBricks();paddle.x=(W-paddle.w)/2;newBall();updateStats();begin();}else{resetGame();begin();}};}
    function loseLife(){lives--;updateStats();if(!lives)return end(false);paddle.x=(W-paddle.w)/2;newBall();}
    function begin(){running=true;scoreSaved=false;$('#overlay').classList.add('hidden');loop();}
    function hitBrick(){for(let i=bricks.length-1;i>=0;i--){const b=bricks[i],ox=Math.min(ball.x+ball.r,b.x+b.w)-Math.max(ball.x-ball.r,b.x),oy=Math.min(ball.y+ball.r,b.y+b.h)-Math.max(ball.y-ball.r,b.y);if(ox>0&&oy>0){if(ox<oy)ball.vx*=-1;else ball.vy*=-1;if(--b.hp===0){burst(b.x+b.w/2,b.y+b.h/2,b.color);bricks.splice(i,1);score+=100;updateStats();if(!bricks.length){end(true);return true;}}return false;}}return false;}
    function moveBall(){const steps=Math.max(1,Math.ceil(Math.max(Math.abs(ball.vx),Math.abs(ball.vy))/4));for(let step=0;step<steps;step++){ball.x+=ball.vx/steps;ball.y+=ball.vy/steps;if(ball.x-ball.r<0||ball.x+ball.r>W){ball.vx*=-1;ball.x=Math.max(ball.r,Math.min(W-ball.r,ball.x));}if(ball.y-ball.r<0)ball.vy=Math.abs(ball.vy);if(ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w&&ball.vy>0){ball.vx=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2)*7;ball.vy=-Math.abs(ball.vy);if(mode==='hard'){ball.vx*=1.055;ball.vy*=1.055;}ball.y=paddle.y-ball.r-1;}if(ball.y-ball.r>H){loseLife();return;}if(hitBrick())return;}}
    function loop(){if(!running)return;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x+paddle.move*paddle.speed));particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life-=.045;return p.life>0;});if(!launched){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;}else moveBall();draw();if(running)frame=requestAnimationFrame(loop);}
    addEventListener('keydown',e=>{if(e.key==='ArrowLeft')paddle.move=-1;if(e.key==='ArrowRight')paddle.move=1;if(e.code==='Space'){e.preventDefault();launched=true;}});addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key))paddle.move=0;});canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();paddle.x=Math.max(0,Math.min(W-paddle.w,(e.clientX-r.left)/r.width*W-paddle.w/2));});canvas.addEventListener('pointerdown',()=>launched=true);
    $('#theme').onclick=()=>{document.body.classList.toggle('light');const light=document.body.classList.contains('light');localStorage.setItem('neon-breaker-theme',light?'light':'dark');$('#theme').textContent=light?'🌙 다크 테마':'☀️ 라이트 테마';draw();};$('#save-score').onclick=saveScore;document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{mode=btn.dataset.mode;resetGame();$('#mode-row').hidden=true;$('#start').hidden=false;$('#start').textContent='게임 시작';$('#submessage').textContent=mode==='easy'?'이지 모드: 일정한 공 속도로 플레이하세요!':'하드 모드: 패들에 닿을 때마다 공이 빨라집니다!';});if(localStorage.getItem('neon-breaker-theme')==='light')$('#theme').click();renderRanking();$('#start').onclick=()=>{resetGame();begin();};resetGame();draw();
  </script>
</body>
</html>
